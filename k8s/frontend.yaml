apiVersion: apps/v1
kind: Deployment
metadata:
  name: preservedhub-frontend
  namespace: preservedhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preservedhub-frontend
  template:
    metadata:
      labels:
        app: preservedhub-frontend
    spec:
      containers:
        - name: frontend
          image: preservedhub-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: preservedhub
spec:
  type: NodePort
  selector:
    app: preservedhub-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
